name: Changelog site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - plugins/*/CHANGELOG.md
      - plugins/*/.claude-plugin/plugin.json
      - .claude-plugin/marketplace.json
      - scripts/build-changelog-site.py

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Build site from CHANGELOGs
        run: scripts/build-changelog-site.py _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
