name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci_workflow_${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Anthropic's canonical marketplace validation (used by claude-plugins-official). No tags exist and its docs require a SHA pin.
      # No claude-cli-version: runs the latest CLI, the same one users install.
      - name: Validate marketplace and plugins
        uses: anthropics/claude-plugins-community/.github/actions/validate-plugins@f60f0454df3045f724c43c6346ec80bdcc3472b2
        with:
          marketplace-path: .claude-plugin/marketplace.json
          fail-on-warnings: true

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Shellcheck
        run: shellcheck plugins/*/hooks/*.sh scripts/*.sh tests/*/*.sh

      - name: Version bump and CHANGELOG guard
        if: github.event_name == 'pull_request'
        run: scripts/version-guard.sh "origin/${{ github.base_ref }}"

  hook-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Hooks run on BSD (macOS) and GNU (Linux) userlands, so test both.
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run hook tests
        run: |
          fail=0
          for t in tests/*/*_test.sh; do
            echo "::group::$t"
            "$t" || fail=1
            echo "::endgroup::"
          done
          exit $fail
